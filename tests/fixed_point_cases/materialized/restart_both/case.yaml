calculator: MACEFixedPointSCF
usage: restart
model:
  name: fixedpoint_l1_stage2
inputs:
  xyz: input.xyz
  index: ':'
keys:
  atomic_multipoles_key: DMA_coeficients
  fermi_level_key: fermi_level
  external_field_key: external_field
  total_charge_key: total_charge
calculator_options:
  use_pbc_evaluator: false
  ignore_nonconverged: false
  save_full_scf_history: false
  restart_density: true
  restart_fermi_level: true
scf_options:
  constant_charge: false
  mixing_parameter: 0.2
  num_scf_steps: 100
  scf_tolerance: 1.0e-05
checks:
  expected_outputs:
  - energy
  - forces
  - density_coefficients
  - dipole
  - fermi_level
  - electrostatic_energy
  - electron_energy
  - num_scf_steps
name: restart_both
description: Sequential restart case reusing both charge density and Fermi level.
materialized_from: tests/fixed_point_cases/cases/restart_both.yaml
