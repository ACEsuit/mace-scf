calculator: MACEFixedPointSCF
usage: single_point
model:
  name: fixedpoint_onebodylinear
inputs:
  xyz: input.xyz
  index: ':'
keys:
  atomic_multipoles_key: DMA_coeficients
  fermi_level_key: fermi_level
  external_field_key: external_field
  total_charge_key: total_charge
calculator_options:
  pbc_handling: mixed_periodic
  use_pbc_evaluator: false
  ignore_nonconverged: false
  save_full_scf_history: false
  restart_density: false
  restart_fermi_level: false
scf_options:
  constant_charge: false
  initial_fermi_level: zero
  mixing_parameter: 0.2
  num_scf_steps: 5
  scf_tolerance: 1.0e-05
checks:
  expected_outputs:
  - energy
  - forces
  - density_coefficients
  - dipole
  - fermi_level
  - electrostatic_energy
  - electron_energy
  - num_scf_steps
name: scf_max_steps
description: max out the scf steps
materialized_from: tests/fixed_point_cases/cases/scf_max_steps.yaml
